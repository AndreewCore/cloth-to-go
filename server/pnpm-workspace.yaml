# Autoriza los scripts de post-instalación de Prisma (descarga de motores y
# generación del cliente). pnpm v11 bloquea los build scripts por defecto.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  # sharp trae su binario precompilado (@img/sharp-<plataforma>); su script
  # solo compilaría libvips desde el código fuente, que no hace falta.
  sharp: false
